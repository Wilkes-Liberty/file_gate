# Routes defined by File Gate.

# Admin configuration form (global defaults + gated-field overview).
file_gate.settings_form:
  path: '/admin/config/media/file-gate'
  defaults:
    _form: '\Drupal\file_gate\Form\SettingsForm'
    _title: 'File Gate'
  requirements:
    _permission: 'administer file gate'

# Public delivery endpoint. Access is intentionally open ("_access: TRUE") —
# the controller enforces the gate itself (it validates the minted grant via the
# file's configured gate method). "no_cache" guarantees the streamed, per-grant
# response is never served from the page cache.
file_gate.download:
  path: '/api/file-gate/download'
  defaults:
    _controller: '\Drupal\file_gate\Controller\DownloadController::download'
  methods: [GET]
  requirements:
    # Open by design: DownloadController validates the minted grant itself.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Server-to-server mint endpoint. Called by a trusted back end (e.g. a decoupled
# front end after its own gate — a lead form, login, etc.). Access is open at the
# routing layer; the controller authenticates the caller with the shared secret
# using a constant-time comparison, and fails closed when no secret is configured.
file_gate.mint:
  path: '/api/file-gate/mint'
  defaults:
    _controller: '\Drupal\file_gate\Controller\MintController::mint'
  methods: [POST]
  requirements:
    # Open by design: MintController authenticates the caller itself.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Server-to-server revoke endpoint. Invalidates a minted `token`-method grant by
# deleting its stored hash — without rotating the site secret (which would break
# every other live link). Authenticated with the same shared secret as mint
# (constant-time), and fails closed when no secret is configured.
file_gate.revoke:
  path: '/api/file-gate/revoke'
  defaults:
    _controller: '\Drupal\file_gate\Controller\RevokeController::revoke'
  methods: [POST]
  requirements:
    # Open by design: RevokeController authenticates the caller itself.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Server-to-server OTP-issue endpoint for the `otp` gate method. A trusted back
# end requests a one-time passcode bound to (file, email); File Gate stores its
# hash and e-mails it. Authenticated with the shared secret (constant-time), and
# fails closed when no secret is configured.
file_gate.otp:
  path: '/api/file-gate/otp'
  defaults:
    _controller: '\Drupal\file_gate\Controller\OtpController::request'
  methods: [POST]
  requirements:
    # Open by design: OtpController authenticates the caller itself.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Browser OTP exchange: validate email+otp, set HttpOnly cookie (GH #43).
# No shared secret — the code itself is the proof. Rate-limited inside.
file_gate.otp_session:
  path: '/api/file-gate/otp/session'
  defaults:
    _controller: '\Drupal\file_gate\Controller\OtpController::establishSession'
  methods: [POST]
  requirements:
    # Open by design: establishSession validates the OTP itself.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Signed_url grant inventory (list, GH #44). Shared-secret auth.
file_gate.grants:
  path: '/api/file-gate/grants'
  defaults:
    _controller: '\Drupal\file_gate\Controller\GrantInventoryController::list'
  methods: [GET]
  requirements:
    # Open by design: GrantInventoryController authenticates the caller itself.
    _access: 'TRUE'
  options:
    no_cache: TRUE

# Bulk revoke signed_url jtis for a field (GH #44).
file_gate.grants_revoke_bulk:
  path: '/api/file-gate/grants/revoke-bulk'
  defaults:
    _controller: '\Drupal\file_gate\Controller\GrantInventoryController::revokeBulk'
  methods: [POST]
  requirements:
    # Open by design: GrantInventoryController authenticates the caller itself.
    _access: 'TRUE'
  options:
    no_cache: TRUE
