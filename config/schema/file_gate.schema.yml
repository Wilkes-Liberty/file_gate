# Configuration schema for File Gate.

file_gate.settings:
  type: config_object
  label: 'File Gate settings'
  mapping:
    download_secret:
      type: string
      label: 'Signing / mint secret'
      # Empty in config; injected from the environment at runtime. Never commit a
      # real value here.
    secret_scopes:
      type: sequence
      label: 'Named secret field scopes'
      sequence:
        type: sequence
        label: 'Field storage keys for one secret id'
        sequence:
          type: string
          label: 'Field storage id (entity_type.field_name)'
    ttl:
      type: integer
      label: 'Default signed-URL TTL (seconds)'
    disposition:
      type: string
      label: 'Content-Disposition (inline or attachment)'
    flood_limit:
      type: integer
      label: 'Mint flood limit (attempts per window per IP)'
    flood_window:
      type: integer
      label: 'Mint flood window (seconds)'
    download_flood_limit:
      type: integer
      label: 'Download denial flood limit (per IP; 0 disables)'
    download_flood_window:
      type: integer
      label: 'Download denial flood window (seconds)'
    require_acting_account:
      type: boolean
      label: 'Require acting account (account/uid) on every mint'
    introspection_client_secret:
      type: string
      label: 'OIDC introspection client secret'
      # Used only by the File Gate Assurance submodule's optional RFC 7662
      # introspection. Like download_secret it is injected from the environment
      # (settings.php) at runtime and left empty in exported config — never commit
      # a real value here.

# Per-field gate configuration, stored as third-party settings on the file/image
# field storage. This is what marks a field's private files as gated and picks
# the gate method that protects them. The schema key is the full field-storage
# config name pattern + ".third_party.<module>" (the core convention for
# third-party settings on field storage, e.g.
# field.storage.*.*.third_party.<module>).
field.storage.*.*.third_party.file_gate:
  type: mapping
  label: 'File Gate field settings'
  mapping:
    gated:
      type: boolean
      label: 'Gate access to these files'
    method:
      type: string
      label: 'Gate method plugin id'
    method_settings:
      type: ignore
      label: 'Gate-method-specific settings'
