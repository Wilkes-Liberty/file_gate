# Global File Gate settings.
#
# SECURITY: download_secret intentionally ships EMPTY. The real value must be
# injected at runtime from the environment (e.g. in settings.php:
#   $config['file_gate.settings']['download_secret'] = getenv('DRUPAL_FILE_GATE_SECRET');
# ) and must never be committed to configuration. While the secret is empty the
# signed-URL and minted-token methods fail CLOSED: minting returns HTTP 503 and
# grant validation fails, so files gated by those methods stay denied. (The
# authenticated, commerce, and form methods enforce their own gate and do not
# use this secret.)
download_secret: ''
# Named secret field scopes (exportable). Values live in settings.php only:
#   $settings['file_gate.secrets'] = ['s_public' => getenv('…'), …];
# Each key is an opaque secret id; each value is a list of field storage ids
# (entity_type.field_name) that credential may mint. A named secret with no
# entry (or an empty list) can mint nothing. The legacy download_secret (no k=
# in the URL) remains whole-corpus for backward compatibility.
secret_scopes: {}
# Default signed-URL lifetime, in seconds. Keep this short — the URL is only
# needed for the moment between minting and the browser starting the download.
ttl: 120
# Content-Disposition for gated downloads: 'attachment' forces a download,
# 'inline' lets the browser render it (e.g. a PDF) in place.
disposition: 'attachment'
# Flood protection for the mint endpoint (failed + successful attempts per IP).
flood_limit: 50
flood_window: 60
# Flood protection for failed download grants (per IP). 0 disables.
download_flood_limit: 120
download_flood_window: 60
# When TRUE, every mint must include acting account (uuid or uid). Can also be
# set per-field via method setting require_identity_mint.
require_acting_account: false
