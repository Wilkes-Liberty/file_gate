file_gate_assurance.step_up:
  path: '/api/file-gate/assurance/step-up'
  defaults:
    _controller: '\Drupal\file_gate_assurance\Controller\BridgeController::stepUpPage'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    no_cache: TRUE

file_gate_assurance.bridge:
  path: '/api/file-gate/assurance/bridge'
  defaults:
    _controller: '\Drupal\file_gate_assurance\Controller\BridgeController::establish'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    # Restricts post-routing provider authentication to cookie. NOTE: this
    # cannot stop a GLOBAL provider (e.g. simple_oauth) from 401-ing a foreign
    # Bearer token pre-routing — that is the AuthorizationShield middleware's
    # job (GH #56); the pin only covers non-global providers.
    _auth: ['cookie']
    no_cache: TRUE

file_gate_assurance.webauthn_enrollment:
  path: '/user/{user}/file-gate-webauthn'
  defaults:
    _form: '\Drupal\file_gate_assurance\Form\WebAuthnEnrollmentForm'
    _title: 'File Gate security keys'
  requirements:
    user: \d+
    _custom_access: '\Drupal\file_gate_assurance\Form\WebAuthnEnrollmentForm::access'
  options:
    parameters:
      user:
        type: entity:user
    no_cache: TRUE

file_gate_assurance.webauthn_register_options:
  path: '/api/file-gate/webauthn/register/options'
  defaults:
    _controller: '\Drupal\file_gate_assurance\Controller\WebAuthnController::registerOptions'
  methods: [POST]
  requirements:
    _permission: 'register file gate webauthn+administer file gate'
  options:
    no_cache: TRUE

file_gate_assurance.webauthn_register:
  path: '/api/file-gate/webauthn/register'
  defaults:
    _controller: '\Drupal\file_gate_assurance\Controller\WebAuthnController::registerComplete'
  methods: [POST]
  requirements:
    _permission: 'register file gate webauthn+administer file gate'
  options:
    no_cache: TRUE

file_gate_assurance.webauthn_credentials:
  path: '/api/file-gate/webauthn/credentials'
  defaults:
    _controller: '\Drupal\file_gate_assurance\Controller\WebAuthnController::listCredentials'
  methods: [GET]
  requirements:
    _permission: 'register file gate webauthn+administer file gate'
  options:
    no_cache: TRUE

file_gate_assurance.webauthn_credential_delete:
  path: '/api/file-gate/webauthn/credentials/delete'
  defaults:
    _controller: '\Drupal\file_gate_assurance\Controller\WebAuthnController::deleteCredential'
  methods: [POST]
  requirements:
    _permission: 'register file gate webauthn+administer file gate'
  options:
    no_cache: TRUE

file_gate_assurance.webauthn_assert_options:
  path: '/api/file-gate/webauthn/assert/options'
  defaults:
    _controller: '\Drupal\file_gate_assurance\Controller\WebAuthnController::assertOptions'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    _auth: ['cookie']
    no_cache: TRUE

file_gate_assurance.webauthn_assert:
  path: '/api/file-gate/webauthn/assert'
  defaults:
    _controller: '\Drupal\file_gate_assurance\Controller\WebAuthnController::assertComplete'
  methods: [POST]
  requirements:
    _access: 'TRUE'
  options:
    _auth: ['cookie']
    no_cache: TRUE
