name: CI

# Test and lint CI for the GitHub mirror. The authoritative test matrix runs on
# drupal.org GitLab CI (.gitlab-ci.yml); this keeps the GitHub mirror honest too.
# Self-contained on purpose: it does not call the org reusable workflows, which
# currently fail at load on every consumer PR (tracked internally as DEV-211).
#
# Drupal 12 is not released yet, so it cannot be built here; the ^12 half of the
# support claim is exercised by the GitLab CI next-major opt-in once 12 ships.

on:
  push:
    branches: ['1.x']
  pull_request:

permissions:
  contents: read

jobs:
  phpcs:
    name: Coding standards (Drupal + DrupalPractice)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2, cs2pr
          coverage: none

      - name: Install Coder
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require drupal/coder:^8.3.24 --no-interaction
          echo "$(composer global config home)/vendor/bin" >> "$GITHUB_PATH"

      - name: Show installed standards
        run: phpcs -i

      - name: Run PHPCS
        run: phpcs -p .

  phpunit:
    name: PHPUnit (Drupal ${{ matrix.drupal }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { drupal: '^11.4', php: '8.3' }
    steps:
      - name: Check out module
        uses: actions/checkout@v4
        with:
          path: file_gate_src

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Build a Drupal codebase
        run: |
          composer create-project drupal/recommended-project:${{ matrix.drupal }} drupal \
            --no-interaction --stability dev --no-install
          cd drupal
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins true
          composer config repositories.file_gate path ../file_gate_src
          composer require \
            drupal/core-dev:${{ matrix.drupal }} \
            'drupal/file_gate:*@dev' \
            'firebase/php-jwt:^6.10 || ^7.0' \
            'web-auth/webauthn-lib:^5.0' \
            --no-interaction --with-all-dependencies

      - name: Run the File Gate suite
        env:
          SIMPLETEST_DB: 'sqlite://localhost/:memory:'
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          cd drupal
          php vendor/bin/phpunit -c web/core/phpunit.xml.dist \
            web/modules/contrib/file_gate/tests \
            web/modules/contrib/file_gate/modules

  # Static analysis had no gate on either venue. The module shipped no
  # phpstan.neon.dist, so the drupalcode job analysed it with the shared
  # gitlab_templates default rather than the level and rules the sibling
  # modules pin, and GitHub ran nothing at all. That is how ten `readonly`
  # injected services stayed green through a stable release while being a
  # fatal on PHP 8.3.
  #
  # PHP 8.3 deliberately, not the newest available: the rule that caught those
  # only reports below 8.4, so analysing solely on the newest PHP would leave
  # the supported floor the version least checked.
  phpstan:
    name: PHPStan (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - name: Check out module
        uses: actions/checkout@v4
        with:
          path: file_gate_src

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      # phpstan-drupal needs a real Drupal tree to resolve core classes;
      # analysing the module alone reports hundreds of "class not found" and
      # says nothing about this code.
      - name: Build a Drupal codebase
        run: |
          composer create-project drupal/recommended-project:^11.4 drupal \
            --no-interaction --stability dev --no-install
          cd drupal
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config --no-plugins allow-plugins true
          composer config repositories.file_gate path ../file_gate_src
          # Assurance deps: JWT for OIDC; webauthn-lib for native WebAuthn mode.
          composer require \
            drupal/core-dev:^11.4 \
            'drupal/file_gate:*@dev' \
            'firebase/php-jwt:^6.10 || ^7.0' \
            'web-auth/webauthn-lib:^5.0' \
            phpstan/phpstan:^2 \
            phpstan/extension-installer:^1.4 \
            mglaman/phpstan-drupal:^2 \
            phpstan/phpstan-deprecation-rules:^2 \
            --no-interaction --with-all-dependencies

      - name: Confirm the working copy is what is analysed
        run: |
          cd drupal
          test -L web/modules/contrib/file_gate \
            || { echo "::error::file_gate is not symlinked to the working copy - the path repo did not apply"; exit 1; }
          readlink web/modules/contrib/file_gate

      - name: Run PHPStan
        run: |
          set -euo pipefail
          cd drupal
          # The module's own phpstan.neon.dist, so this and the drupalcode job
          # ask the same question rather than two similar ones.
          vendor/bin/phpstan analyze web/modules/contrib/file_gate \
            -c web/modules/contrib/file_gate/phpstan.neon.dist \
            --autoload-file=vendor/autoload.php \
            --no-progress \
            --memory-limit=2G
