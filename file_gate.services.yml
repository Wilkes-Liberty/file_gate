services:

  file_gate.file_references:
    class: Drupal\file_gate\Compatibility\FileReferenceResolver
    factory: ['Drupal\file_gate\Compatibility\FileReferenceResolverFactory', create]
    arguments: ['@service_container']

  Drupal\file_gate\Hook\GatedFieldSchemeGuard:
    arguments: ['@file_gate.audit']

  Drupal\file_gate\Hook\FileGateRequirements:
    arguments: ['@entity_type.manager', '@file_gate.secret_registry']

  file_gate.download_denied_subscriber:
    class: Drupal\file_gate\EventSubscriber\DownloadDeniedSubscriber
    tags:
      - { name: event_subscriber }

  file_gate.secret_registry:
    class: Drupal\file_gate\SecretRegistry
    arguments:
      - '@config.factory'
      - '@settings'

  file_gate.active_secret:
    class: Drupal\file_gate\ActiveSecret

  file_gate.metrics:
    class: Drupal\file_gate\Service\FileGateMetrics
    arguments:
      - '@database'
      - '@module_handler'
      - '@datetime.time'

  file_gate.gated_field_overview:
    class: Drupal\file_gate\Service\GatedFieldOverview
    arguments:
      - '@entity_type.manager'

  file_gate.audit:
    class: Drupal\file_gate\Service\FileGateAudit
    arguments:
      - '@?audit_chain.logger'
      - '@logger.channel.file_gate'

  file_gate.grant_inventory:
    class: Drupal\file_gate\Service\GrantInventory
    arguments:
      - '@keyvalue.expirable'
      - '@datetime.time'
      - '@lock'

  file_gate.otp_session:
    class: Drupal\file_gate\Service\OtpSession
    arguments:
      - '@file_gate.secret_registry'
      - '@datetime.time'

  file_gate.grant_signer:
    class: Drupal\file_gate\GrantSigner
    arguments:
      - '@config.factory'
      - '@datetime.time'
      - '@file_gate.secret_registry'

  plugin.manager.file_gate.gate_method:
    class: Drupal\file_gate\GateMethodManager
    parent: default_plugin_manager

  file_gate.parent_walker:
    class: Drupal\file_gate\ParentWalker

  file_gate.host_access:
    class: Drupal\file_gate\HostAccess
    arguments:
      - '@file_gate.file_references'
      - '@file_gate.parent_walker'

  file_gate.resolver:
    class: Drupal\file_gate\FileGateResolver
    arguments:
      - '@file_gate.file_references'
      - '@entity_type.manager'
      - '@stream_wrapper_manager'

  file_gate.mint_stored_field:
    class: Drupal\file_gate\MintStoredField
    arguments:
      - '@file_gate.grant_inventory'
      - '@keyvalue.expirable'

  file_gate.file_target_resolver:
    class: Drupal\file_gate\FileTargetResolver
    arguments:
      - '@entity.repository'
      - '@entity_type.manager'

  logger.channel.file_gate:
    parent: logger.channel_base
    arguments:
      - 'file_gate'

  file_gate.gated_field_scheme_validator:
    class: Drupal\file_gate\EventSubscriber\GatedFieldSchemeValidator
    tags:
      - { name: event_subscriber }

  file_gate.gated_field_scheme_save_subscriber:
    class: Drupal\file_gate\EventSubscriber\GatedFieldSchemeSaveSubscriber
    arguments:
      - '@file_gate.audit'
    tags:
      - { name: event_subscriber }

  http_middleware.file_gate_authorization_shield:
    class: Drupal\file_gate\StackMiddleware\AuthorizationShield
    # StackedKernelPass prepends the inner kernel. This argument is the
    # language-prefix config, so an unrelated route is not shielded.
    arguments: ['@config.factory']
    tags:
      - { name: http_middleware, priority: 180 }
