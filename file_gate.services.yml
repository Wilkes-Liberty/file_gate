services:

  # Resolves legacy + named mint/signing secrets and field scopes.
  file_gate.secret_registry:
    class: Drupal\file_gate\SecretRegistry
    arguments:
      - '@config.factory'
      - '@settings'

  # Secret id for the current mint/revoke/otp request (set by shared-secret auth).
  file_gate.active_secret:
    class: Drupal\file_gate\ActiveSecret

  # Admin dashboard aggregates from the file_gate logger / dblog.
  file_gate.metrics:
    class: Drupal\file_gate\Service\FileGateMetrics
    arguments:
      - '@database'
      - '@module_handler'
      - '@datetime.time'

  # Optional durable audit (audit_chain when installed). Soft dependency.
  file_gate.audit:
    class: Drupal\file_gate\Service\FileGateAudit
    arguments:
      - '@?audit_chain.logger'
      - '@logger.channel.file_gate'

  # Signed_url jti inventory for list/bulk-revoke (GH #44).
  file_gate.grant_inventory:
    class: Drupal\file_gate\Service\GrantInventory
    arguments:
      - '@keyvalue.expirable'
      - '@datetime.time'

  # OTP redeem session cookie (no secrets in query, GH #43).
  file_gate.otp_session:
    class: Drupal\file_gate\Service\OtpSession
    arguments:
      - '@file_gate.secret_registry'
      - '@datetime.time'

  # Target-agnostic HMAC grant signer. Deliberately knows nothing about files:
  # it signs/validates an opaque "resource id" string plus an expiry, so the same
  # signing core can back a future content_gate / entity_gate without change.
  file_gate.grant_signer:
    class: Drupal\file_gate\GrantSigner
    arguments:
      - '@config.factory'
      - '@datetime.time'
      - '@file_gate.secret_registry'

  # Plugin manager for gate methods (Plugin/GateMethod/*). Third parties add new
  # ways to prove a request has passed the gate (token, email capture, …).
  plugin.manager.file_gate.gate_method:
    class: Drupal\file_gate\GateMethodManager
    parent: default_plugin_manager

  # File-specific glue: given a managed file, decide whether (and how) it is gated
  # by reading the gate configuration off the field(s) that reference it.
  file_gate.resolver:
    class: Drupal\file_gate\FileGateResolver
    arguments:
      - '@Drupal\file\FileReferenceResolver'
      - '@entity_type.manager'
      - '@stream_wrapper_manager'

  # Dedicated logger channel. Carries both security events (denied downloads,
  # failed mint authentication, fail-closed refusals) and usage/stats events
  # (successful mints and deliveries) for auditing and analytics.
  logger.channel.file_gate:
    parent: logger.channel_base
    arguments:
      - 'file_gate'

  # Rejects a config import that would mark a public-scheme field as gated.
  # The field edit form forces the private scheme, but a config-import
  # deploy never runs the form — and a gated public field is not a gate.
  file_gate.gated_field_scheme_validator:
    class: Drupal\file_gate\EventSubscriber\GatedFieldSchemeValidator
    tags:
      - { name: event_subscriber }

  # Stashes Bearer/DPoP Authorization into a request attribute on File Gate's
  # own token endpoints before any authentication provider runs, so a global
  # provider (e.g. simple_oauth) cannot 401 a foreign IdP token pre-routing
  # (GH #56 / d.o #3614535).
  http_middleware.file_gate_authorization_shield:
    class: Drupal\file_gate\StackMiddleware\AuthorizationShield
    tags:
      - { name: http_middleware, priority: 180 }
