name: 'File Gate'
type: module
description: 'Gate access to private files with pluggable methods (short-lived signed URLs, authenticated access, …) and deliver them to any decoupled front end.'
package: 'Security'
core_version_requirement: ^10.6 || ^11.3 || ^12
# Only core File is required. Media is optional — gating works for any private
# file field, whether or not the file is wrapped in a media entity.
dependencies:
  - 'drupal:file'
configure: file_gate.settings_form
