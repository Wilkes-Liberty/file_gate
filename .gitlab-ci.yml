################
# Drupal GitLabCI template for contrib modules.
#
# Replicates DrupalCI testing via the centrally maintained include files.
# https://www.drupal.org/docs/develop/git/using-gitlab-to-contribute-to-drupal
################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - '/includes/include.drupalci.main.yml'
      - '/includes/include.drupalci.variables.yml'
      - '/includes/include.drupalci.workflows.yml'

variables:
  _GITLAB_TEMPLATES_REPO: project/gitlab_templates
  _GITLAB_TEMPLATES_REF: main
  # The base module also supports 10.6/11.3; the supported-core GitHub workflow
  # covers those base-module floors. Optional submodules retain 11.4, which
  # the default full-integration phpunit job exercises.
  #
  # The `^12` half is deliberately MANUAL rather than autorun: the next major is
  # a moving dev target, and a pipeline that goes red on upstream churn teaches
  # nothing and trains people to ignore the badge. Run it before tagging, and
  # resolve any compatibility failures before claiming next-major readiness.
  OPT_IN_TEST_NEXT_MAJOR: '1'
  # Forward-compat signal on the upcoming minor, available on demand.
  OPT_IN_TEST_NEXT_MINOR: '1'
